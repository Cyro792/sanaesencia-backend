services:
  ms-pacientes:
    build: ./ms-pacientes
    container_name: ms-pacientes
    ports:
      - "8081:8081"
    volumes:
      - ./Wallet:/app/wallet:ro
    environment:
      - ORACLE_WALLET_PATH=/app/wallet
    networks:
      - sanaesencia-net
    restart: unless-stopped

  ms-catalogo:
    build: ./ms-catalogo
    container_name: ms-catalogo
    ports:
      - "8082:8082"
    volumes:
      - ./Wallet:/app/wallet:ro
    environment:
      - ORACLE_WALLET_PATH=/app/wallet
    networks:
      - sanaesencia-net
    restart: unless-stopped

  ms-agenda:
    build: ./ms-agenda
    container_name: ms-agenda
    ports:
      - "8083:8083"
    volumes:
      - ./Wallet:/app/wallet:ro
    environment:
      - ORACLE_WALLET_PATH=/app/wallet
    networks:
      - sanaesencia-net
    restart: unless-stopped

  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-pacientes
      - ms-catalogo
      - ms-agenda
    networks:
      - sanaesencia-net
    restart: unless-stopped

networks:
  sanaesencia-net:
    driver: bridge
