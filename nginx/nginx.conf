server {
    listen 80;
    server_name localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Microservicio Pacientes
    location /api/pacientes {
        proxy_pass http://ms-pacientes:8081;
    }

    # Microservicio Catálogo - Productos
    location /api/productos {
        proxy_pass http://ms-catalogo:8082;
    }

    # Microservicio Catálogo - Especialistas
    location /api/especialistas {
        proxy_pass http://ms-catalogo:8082;
    }

    # Microservicio Agenda - Citas
    location /api/citas {
        proxy_pass http://ms-agenda:8083;
    }
}
